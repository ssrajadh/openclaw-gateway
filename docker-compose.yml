services:
  gateway:
    build: .
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      - OPENCLAW_WORKER_URL=${OPENCLAW_WORKER_URL:-http://host.docker.internal:18789}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_audit.sql:/docker-entrypoint-initdb.d/init_audit.sql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
